# 接続先は config/redis.yml が環境・用途ごとに決める (cable は db 1)。
# REDIS_URL は使わない。理由は doc/redis.md を参照。

# development / test は単一プロセスで完結するので Redis に依存させない。
# 複数プロセス・複数コンテナで配信する必要が出た時点で redis アダプタに変える。
development:
  adapter: async

test:
  adapter: test

production:
  adapter: redis
  url: <%= Rails.application.config_for(:redis)[:cable_url] %>
  channel_prefix: check_rails_production
