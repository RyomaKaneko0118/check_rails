# 接続情報は compose.yaml の environment から受け取る。
# DATABASE_URL は使わない (全環境の設定を上書きし、RAILS_ENV=test での実行が
# development の DB を壊すため)。DB 名はこのファイルが環境ごとに決める。
default: &default
  adapter: postgresql
  encoding: unicode
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "db") %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: check_rails_development

# "test" の DB は rake 実行時に作り直される。development と同じ名前にしないこと。
test:
  <<: *default
  database: check_rails_test

production:
  primary: &primary_production
    <<: *default
    database: check_rails_production
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["APP_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: check_rails_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: check_rails_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: check_rails_production_cable
    migrations_paths: db/cable_migrate
