name: check_rails

services:
  web:
    build:
      context: .
      args:
        # バージョンは秘密ではなく、環境間でズレると困るのでここに固定する
        RUBY_VERSION: "4.0.7"   # Ruby 最新安定版
        NODE_VERSION: "26.9.0"  # Node.js 最新安定版 (Current)
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
      - node_modules:/app/node_modules
    environment:
      # DATABASE_URL は全環境の設定を上書きし、test 実行時に development の DB を
      # 破壊するため使わない。部品で渡し、DB 名は config/database.yml 側で決める。
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # REDIS_URL は redis gem が暗黙に拾い、test が development のデータを壊すため使わない。
      # ホストだけ渡し、DB 番号は config/redis.yml 側で環境・用途ごとに決める。
      REDIS_HOST: redis
      RAILS_ENV: ${RAILS_ENV:-development}
      TZ: ${TZ:-Asia/Tokyo}
    depends_on:
      - db
      - redis
    tty: true
    stdin_open: true

  db:
    image: postgres:18.6-trixie  # PostgreSQL 最新安定版
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 から VOLUME が /var/lib/postgresql/data → /var/lib/postgresql に変更
      - pgdata:/var/lib/postgresql

  redis:
    image: valkey/valkey:9.1.2-trixie  # Valkey 最新安定版 (Redis 互換, BSD ライセンス)
    command: ["valkey-server", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  bundle:
  node_modules:
  pgdata:
  redisdata:
